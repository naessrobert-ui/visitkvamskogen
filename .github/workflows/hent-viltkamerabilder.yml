name: Hent viltkamerabilder

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hent-viltkamerabilder.yml'
      - 'scripts/hent-viltkamerabilder.py'
      - 'scripts/tests/test_hent_viltkamerabilder.py'
  schedule:
    - cron: '13,43 * * * *'

concurrency:
  group: hent-viltkamerabilder
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hent-bilder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sjekk kjøretid
        id: time-window
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          hour=$(TZ=Europe/Oslo date +%H)
          if [ "$hour" -ge 6 ] && [ "$hour" -le 23 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sjekk ut repo
        if: steps.time-window.outputs.run == 'true'
        uses: actions/checkout@v5

      - name: Sett opp Python
        if: steps.time-window.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Kjør tester
        if: steps.time-window.outputs.run == 'true'
        run: python -m unittest discover -s scripts/tests

      - name: Hent nye bilder fra Gmail
        if: steps.time-window.outputs.run == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.WILDLIFE_GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.WILDLIFE_GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WILDLIFE_RECLASSIFY_SINCE: '2026-08-30T00:00:00+02:00'
        run: python scripts/hent-viltkamerabilder.py
